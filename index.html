<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fingrow Site</title>
    <link rel="stylesheet" href="styles.css"> <!-- Existing styles -->
</head>
<body>
    <div class="app-container">
        <!-- Certificate System -->
        <section id="certificate">
            <h2>Certificates</h2>
            <button id="download-cert">Download Certificate</button>
            <form id="certificate-form">
                <label for="certificate-name">Name:</label>
                <input type="text" id="certificate-name" required />
                <label for="certificate-email">Email:</label>
                <input type="email" id="certificate-email" required />
                <button type="submit">Submit</button>
            </form>
        </section>

        <!-- Admin Panel -->
        <section id="admin-panel">
            <h2>Admin Panel</h2>
            <div id="real-time-stats"></div>
            <div id="user-analytics"></div>
            <div id="certificate-template-management"></div>
            <div id="export-data"></div>
            <div id="notifications"></div>
        </section>

        <!-- Lesson Content -->
        <section id="lessons">
            <h2>Lessons on Financial Literacy</h2>
            <div class="lesson" id="lesson-1">
                <h3>Lesson 1: Introduction to Budgeting</h3>
                <p>Theory block content...</p>
                <button class="next">Next</button>
                <div class="interactive-question">
                    <p>Question?</p>
                    <input type="text" />
                </div>
            </div>
            <!-- Repeat for other lessons... -->
        </section>
    </div>

    <!-- Include React and other necessary libraries -->
    <script src="react.js"></script>
    <script src="framer-motion.js"></script>
    <script src="app.js"></script> <!-- Your existing React code -->
</body>
</html>
