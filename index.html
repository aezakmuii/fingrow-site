        * {

        const { useState, useEffect, useRef } = React;
        const { motion, AnimatePresence } = window.Motion || window['framer-motion'] || (() => {
            const MotionDiv = ({children, ...props}) => <div {...props}>{children}</div>;
            return {
                motion: {
                    div: MotionDiv,
                    button: MotionDiv,
                    h1: MotionDiv,
                    h2: MotionDiv,
                    p: MotionDiv,
                },
                AnimatePresence: ({children}) => <>{children}</>
            };
        })();

        // AI settings for OpenAI integration (клиентская заглушка)
        // В продакшене API-ключ должен храниться на сервере.
        const AI_SETTINGS = {
            openaiApiKey: '',
            model: 'gpt-4.1-mini'
        };

        // Модальное окно урока: теория + практика
        const LessonModal = ({ lesson, onClose, onComplete }) => {
            const [step, setStep] = useState('theory'); // 'theory' | 'quiz'
            const [answers, setAnswers] = useState({});
            const [showResult, setShowResult] = useState(false);

            const content = lessonsData[lesson.id];
            if (!content) return null;

            const questions = content.questions || [];

            const handleSelect = (qIndex, optionIndex) => {
                setAnswers(prev => ({ ...prev, [qIndex]: optionIndex }));
            };

            const allAnswered = questions.length > 0 && Object.keys(answers).length === questions.length;

            const handleFinish = () => {
                setShowResult(true);
                const correctCount = questions.reduce((sum, q, i) => {
                    return sum + (answers[i] === q.correct ? 1 : 0);
                }, 0);
                const successRate = Math.round((correctCount / questions.length) * 100);

                // Завершаем урок независимо от процента, но показываем результат
                setTimeout(() => {
                    onComplete();
                    alert(`Урок завершён! Правильных ответов: ${correctCount} из ${questions.length} (${successRate}%).`);
                }, 300);
            };

            return (
                <motion.div
                    initial={{ opacity: 0 }}
                    animate={{ opacity: 1 }}
                    exit={{ opacity: 0 }}
                    className="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm overflow-y-auto"
                    onClick={onClose}

                            <button

                            >
                                Закрыть

                        </div>

                        <div className="flex items-center space-x-3 mb-4 text-sm text-gray-400">

                            <span>•</span>
                            <span>Вопросов: {questions.length}</span>
                        </div>

                        <div className="flex mb-4 space-x-2 text-sm">
                            <button
                                className={`flex-1 py-2 rounded-xl ${step === 'theory' ? 'btn-primary' : 'glass'}`}
                                onClick={() => setStep('theory')}
                            >
                                Теория
                            </button>
                            <button
                                className={`flex-1 py-2 rounded-xl ${step === 'quiz' ? 'btn-primary' : 'glass'}`}
                                onClick={() => setStep('quiz')}
                                disabled={!content.theory}
                            >
                                Практика и вопросы
                            </button>
                        </div>

                        {step === 'theory' && (
                            <div className="glass rounded-2xl p-4 text-sm sm:text-base text-gray-200 whitespace-pre-line">
                                {content.theory}
                                <p className="mt-4 text-xs text-gray-400">
                                    Прочитай теорию внимательно, затем переходи к вопросам, чтобы закрепить материал.
                                </p>
                            </div>
                        )}

                        {step === 'quiz' && (
                            <div className="space-y-4 max-h-[420px] overflow-y-auto mt-2">
                                {questions.map((q, index) => (
                                    <div key={index} className="glass rounded-2xl p-4">
                                        <div className="flex items-center justify-between mb-2">
                                            <span className="text-xs text-gray-400">Вопрос {index + 1}</span>
                                        </div>
                                        <p className="mb-3 text-sm sm:text-base">{q.q}</p>
                                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">

                                                const selected = answers[index] === optIndex;
                                                return (
                                                    <button
                                                        key={optIndex}
                                                        type="button"
                                                        onClick={() => handleSelect(index, optIndex)}
                                                        className={`
                                                            text-left px-3 py-2 rounded-xl text-sm
                                                            ${selected ? 'bg-emerald-500 text-white' : 'glass hover:bg-white/10'}
                                                        `}
                                                    >
                                                        {opt}
                                                    </button>
                                                );
                                            })}
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}

                            </span>
                            {step === 'quiz' && (

                                    onClick={handleFinish}
                                    disabled={!allAnswered}
                                    className={`px-6 py-2 rounded-xl font-bold text-sm ${

                                    }`}
                                >

                                </button>
                            )}

        // Sound effects
        const playSound = (type) => {
            try {
                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                
                const frequencies = {
                    'click': 800,
                    'success': 1200,
                    'error': 400,
                    'pop': 600,
                    'unlock': 1000
                };
                
                oscillator.frequency.value = frequencies[type] || 600;
                oscillator.type = 'sine';
                
                gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.1);
                
                oscillator.start(audioContext.currentTime);

                        className="glass-strong rounded-3xl p-6 sm:p-8 max-w-md w-full"
                    >
                        <div className="flex justify-between items-center mb-4">
                            <h2 className="text-xl sm:text-2xl font-bold orbitron text-gradient">Профиль</h2>
                            <button
                                onClick={onClose}
                                className="glass px-3 py-1 rounded-xl hover:bg-white/10 text-sm"
                            >
                                Закрыть
                            </button>
                        </div>

                        <div className="space-y-3 text-sm sm:text-base text-gray-200">
                            <div>
                                <p className="text-gray-400 text-xs mb-1">Имя и фамилия</p>
                                <p className="glass rounded-xl px-3 py-2">{user.fullName}</p>
                            </div>
                            <div>
                                <p className="text-gray-400 text-xs mb-1">Email</p>
                                <p className="glass rounded-xl px-3 py-2 break-all">{user.email}</p>
                            </div>
                            <div className="grid grid-cols-3 gap-2 text-center mt-2">
                                <div className="glass rounded-xl p-2">
                                    <div className="text-emerald-400 font-bold">{user.level}</div>
                                    <div className="text-[11px] text-gray-400">Уровень</div>
                                </div>
                                <div className="glass rounded-xl p-2">
                                    <div className="text-yellow-400 font-bold">{user.xp}</div>
                                    <div className="text-[11px] text-gray-400">XP</div>
                                </div>
                                <div className="glass rounded-xl p-2">
                                    <div className="text-amber-400 font-bold">{user.streak}</div>
                                    <div className="text-[11px] text-gray-400">Дней подряд</div>
                                </div>
                            </div>
                        </div>

                        <p className="mt-4 text-xs text-gray-500">
                            В продакшене редактирование профиля (смена имени, пароля и т.п.) лучше реализовать через сервер.
                        </p>
                    </motion.div>
                </motion.div>
            );
        };

        const App = () => {
            const [appState, setAppState] = useState('landing');
            const [showAuth, setShowAuth] = useState(false);
            const [showStats, setShowStats] = useState(false);
            const [showAI, setShowAI] = useState(false);
            const [showCertificate, setShowCertificate] = useState(false);
            const [showAbout, setShowAbout] = useState(false);
            const [showPrivacy, setShowPrivacy] = useState(false);
            const [showAdmin, setShowAdmin] = useState(false);
            const [showProfile, setShowProfile] = useState(false);
            const [user, setUser] = useState(null);
            const [lessons, setLessons] = useState(allLessons);
            const [currentLesson, setCurrentLesson] = useState(null);
            const [certificateId, setCertificateId] = useState(null);
            const [certificateDate, setCertificateDate] = useState(null);
            const [customPages, setCustomPages] = useState({ about: '', privacy: '' });

            const handleGetStarted = () => {
                playSound('click');
                setShowAuth(true);
            };

            const handleAuth = (userData) => {
                if (userData.isAdmin) {
                    setShowAuth(false);
                    setShowAdmin(true);
                    playSound('success');
                    return;
                }

                setUser({
                    email: userData.email,
                    firstName: userData.firstName,
                    lastName: userData.lastName,
                    fullName: `${userData.firstName} ${userData.lastName}`,
                    streak: 7,
                    xp: 350,
                    level: 1
                });
                setShowAuth(false);
                setAppState('learning');
                playSound('success');
            };

            const handleLogout = () => {
                setUser(null);
                setAppState('landing');
                setLessons(allLessons);
                setShowStats(false);
                setShowAI(false);
                setShowCertificate(false);
            };

            const handleLessonClick = (lesson) => {
                if (!lesson.locked) {
                    setCurrentLesson(lesson);
                    playSound('pop');
                }
            };

            const handleLessonComplete = () => {
                const completedLessons = lessons.filter(l => l.completed).length;
                
                const updatedLessons = lessons.map(l => 
                    l.id === currentLesson.id 
                        ? { ...l, completed: true }
                        : l.id === currentLesson.id + 1
                            ? { ...l, locked: false }
                            : l
                );
                
                setLessons(updatedLessons);
                setUser({ ...user, xp: user.xp + currentLesson.xp });
                setCurrentLesson(null);
                
                // Show certificate if all lessons completed
                if (completedLessons + 1 === 100) {
                    const newId = `FG-${Date.now().toString(36).toUpperCase()}`;
                    const nowIso = new Date().toISOString();
                    setCertificateId(newId);
                    setCertificateDate(nowIso);
                    setTimeout(() => {
                        setShowCertificate(true);
                    }, 1000);
                }
                
                playSound('unlock');
            };

            if (showAdmin) {
                return (
                    <AdminPanel
                        lessons={lessons}
                        setLessons={setLessons}
                        users={null}
                        customPages={customPages}
                        setCustomPages={setCustomPages}
                        onForceCertificate={() => {
                            if (!user) {
                                alert('Сначала войдите как ученик, чтобы выдать ему сертификат.');
                                return;
                            }
                            if (!certificateId) {
                                const newId = `FG-${Date.now().toString(36).toUpperCase()}`;
                                const nowIso = new Date().toISOString();
                                setCertificateId(newId);
                                setCertificateDate(nowIso);
                            }
                            setShowCertificate(true);
                            playSound('unlock');
                        }}
                        onClose={() => setShowAdmin(false)}
                    />
                );
            }

            if (appState === 'landing') {
                return (
                    <>
                        <LandingPage 
                            onGetStarted={handleGetStarted}
                            onLearnMore={() => {
                                playSound('click');
                                alert('Информация о платформе доступна в разделе "О нас"');
                            }}
                            onAbout={() => {
                                playSound('click');
                                setShowAbout(true);
                            }}
                            onPrivacy={() => {
                                playSound('click');
                                setShowPrivacy(true);
                            }}
                        />
                        <AnimatePresence>
                            {showAuth && (
                                <AuthModal
                                    isOpen={showAuth}
                                    onClose={() => setShowAuth(false)}
                                    onAuth={handleAuth}
                                />
                            )}
                            {showAbout && (
                                <AboutPage onClose={() => setShowAbout(false)} customText={customPages.about} />
                            )}
                            {showPrivacy && (
                                <PrivacyPage onClose={() => setShowPrivacy(false)} customText={customPages.privacy} />
                            )}
                        </AnimatePresence>
                    </>
                );
            }

            // Learning interface continues as before but with new components...
            // (I'll continue with the full implementation in the output file)

            return (
                <div className="min-h-screen">
                    {/* Header with new buttons */}
                    <motion.header 
                        initial={{ y: -100 }}
                        animate={{ y: 0 }}
                        className="fixed top-0 left-0 right-0 z-50 glass-strong border-b border-white/10"
                    >
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 py-4 flex justify-between items-center">
                            <div className="flex items-center space-x-2">
                                <div className="w-10 h-10 bg-gradient-to-br from-emerald-400 to-emerald-600 rounded-lg flex items-center justify-center">
                                    <span className="text-2xl">💎</span>
                                </div>
                                <h1 className="text-xl sm:text-2xl font-bold orbitron text-gradient">
                                    FinGrow
                                </h1>
                            </div>
                            
                            <div className="flex items-center space-x-2 sm:space-x-4">
                                <div className="hidden sm:flex items-center space-x-2 glass px-3 py-2 rounded-xl">
                                    <span className="text-xl">🔥</span>
                                    <span className="font-bold text-amber-400">{user.streak}</span>
                                </div>
                                
                            <div className="flex items-center space-x-2 glass px-3 py-2 rounded-xl">
                                <span className="text-xl">⭐</span>
                                <span className="font-bold text-yellow-400">{user.xp}</span>
                            </div>
                                
                                <button
                                    onClick={() => {
                                        setShowStats(true);
                                        playSound('click');
                                    }}
                                    className="glass px-3 py-2 rounded-xl hover:bg-white/10 transition-all"
                                    title="Статистика"
                                >
                                    📊
                                </button>

                                <button
                                    onClick={() => {
                                        setShowAI(true);
                                        playSound('click');
                                    }}
                                    className="glass px-3 py-2 rounded-xl hover:bg-white/10 transition-all"
                                    title="AI Помощник"
                                >
                                    🤖
                                </button>

                                <button
                                    onClick={() => {
                                        setShowProfile(true);
                                        playSound('click');
                                    }}
                                    className="hidden sm:flex items-center space-x-2 glass px-3 py-2 rounded-xl hover:bg-white/10 transition-all text-xs sm:text-sm"
                                    title="Профиль"
                                >
                                    <span className="text-sm">👤</span>
                                    <span>{user.firstName}</span>
                                </button>

                                <button
                                    onClick={handleLogout}
                                    className="glass px-3 py-2 rounded-xl hover:bg-white/10 transition-all text-xs sm:text-sm"
                                >
                                    Выйти
                                </button>
                            </div>
                        </div>
                    </motion.header>
                    
                    <div className="max-w-5xl mx-auto px-4 pt-32 pb-20">
                        <motion.div
                            initial={{ opacity: 0, y: 20 }}
                            animate={{ opacity: 1, y: 0 }}
                            className="text-center mb-12"
                        >
                            <h2 className="text-3xl sm:text-5xl font-bold orbitron mb-2 text-gradient">
                                Привет, {user.firstName}!
                            </h2>
                            <p className="text-gray-400 text-lg">
                                Продолжай строить свою башню знаний
                            </p>
                        </motion.div>
                        
                        {/* Lessons organized by units */}
                        <div className="space-y-6">
                            {Object.values(
                                lessons.reduce((acc, lesson) => {
                                    if (!acc[lesson.unitName]) {
                                        acc[lesson.unitName] = {
                                            name: lesson.unitName,
                                            icon: lesson.unitIcon,
                                            lessons: []
                                        };
                                    }
                                    acc[lesson.unitName].lessons.push(lesson);
                                    return acc;
                                }, {})
                            ).map((unit, idx) => {
                                const completedInUnit = unit.lessons.filter(l => l.completed).length;
                                const unitProgress = Math.round((completedInUnit / unit.lessons.length) * 100);
                                return (
                                    <div key={idx} className="glass rounded-3xl p-5 sm:p-6">
                                        <div className="flex items-center justify-between mb-4">
                                            <div className="flex items-center space-x-3">
                                                <div className="text-3xl">{unit.icon}</div>
                                                <div>
                                                    <h3 className="text-lg sm:text-xl font-bold">{unit.name}</h3>
                                                    <p className="text-xs sm:text-sm text-gray-400">
                                                        Пройдено {completedInUnit}/{unit.lessons.length} ({unitProgress}%)
                                                    </p>
                                                </div>
                                            </div>
                                            <div className="hidden sm:block w-32 h-2 bg-gray-800 rounded-full overflow-hidden">
                                                <div
                                                    className="h-full bg-gradient-to-r from-emerald-500 to-teal-500"
                                                    style={{ width: `${unitProgress}%` }}
                                                />
                                            </div>
                                        </div>

                                        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
                                            {unit.lessons.map(lesson => (
                                                <button
                                                    key={lesson.id}
                                                    onClick={() => handleLessonClick(lesson)}
                                                    disabled={lesson.locked}
                                                    className={`
                                                        glass rounded-2xl p-4 text-left transition-all
                                                        ${lesson.locked ? 'opacity-50 cursor-not-allowed' : 'hover:bg-white/10 cursor-pointer'}
                                                        ${lesson.completed ? 'border border-emerald-500' : ''}
                                                    `}
                                                >
                                                    <div className="flex items-center justify-between mb-2">
                                                        <span className="text-xs text-gray-400">Урок {lesson.id}</span>
                                                        <span className="text-xs">
                                                            {lesson.completed ? '✅ Пройден' : lesson.locked ? '🔒 Закрыт' : '▶ Открыт'}
                                                        </span>
                                                    </div>
                                                    <div className="font-semibold mb-2 line-clamp-2">{lesson.title}</div>
                                                    <div className="flex items-center justify-between text-xs text-gray-400">
                                                        <span>{lesson.questionsCount} вопросов</span>
                                                        <span className="text-emerald-400 font-semibold">+{lesson.xp} XP</span>
                                                    </div>
                                                </button>
                                            ))}
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    </div>

                    {/* Modals */}
                    <AnimatePresence>
                        {showStats && (
                            <Statistics
                                user={user}
                                lessons={lessons}
                                onClose={() => setShowStats(false)}
                            />
                        )}
                        {showAI && (
                            <AIAssistant
                                isOpen={showAI}
                                onClose={() => setShowAI(false)}
                                userName={user.firstName}
                            />
                        )}
                        {showCertificate && (
                            <Certificate
                                userName={user.fullName}
                                certificateId={certificateId}
                                issuedAt={certificateDate}
                                onClose={() => setShowCertificate(false)}
                            />
                        )}
                        {currentLesson && (
                            <LessonModal
                                lesson={currentLesson}
                                onClose={() => setCurrentLesson(null)}
                                onComplete={handleLessonComplete}
                            />
                        )}
                        {showProfile && (
                            <ProfileModal
                                user={user}
                                onClose={() => setShowProfile(false)}
                            />
                        )}
                    </AnimatePresence>

                    {/* AI Mascот + быстрый доступ к сертификату */}
                    <button
                        onClick={() => {
                            setShowAI(true);
                            playSound('pop');
                        }}
                        className="fixed bottom-6 right-6 z-50 glass-strong rounded-full w-20 h-20 flex items-center justify-center border-2 border-emerald-500 hover:scale-110 transition-transform float-animation"
                    >
                        <span className="text-4xl">🧢</span>
                    </button>

                    {certificateId && (
                        <button
                            onClick={() => {
                                setShowCertificate(true);
                                playSound('click');
                            }}
                            className="fixed bottom-6 left-6 z-50 glass-strong rounded-full w-20 h-20 flex items-center justify-center border-2 border-yellow-500 hover:scale-110 transition-transform"
                            title="Мой сертификат"
                        >
                            <span className="text-3xl">🏆</span>
                        </button>
                    )}
                </div>
            );
        };

        // Statistics Component with fixed close button
        const Statistics = ({ user, lessons, onClose }) => {
            const completedLessons = lessons.filter(l => l.completed).length;
            const totalXP = lessons.filter(l => l.completed).reduce((sum, l) => sum + l.xp, 0);
            const progress = (completedLessons / lessons.length) * 100;
            const currentLevel = Math.floor(totalXP / 500) + 1;
            const xpToNextLevel = 500 - (totalXP % 500);

            const unitProgress = {};
            lessons.forEach(lesson => {
                if (!unitProgress[lesson.unitName]) {
                    unitProgress[lesson.unitName] = { total: 0, completed: 0, icon: lesson.unitIcon };
                }
                unitProgress[lesson.unitName].total++;
                if (lesson.completed) unitProgress[lesson.unitName].completed++;
            });

            return (
                <motion.div
                    initial={{ opacity: 0 }}
                    animate={{ opacity: 1 }}
                    exit={{ opacity: 0 }}
                    className="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm overflow-y-auto"
                    onClick={onClose}
                >
                    <motion.div
                        initial={{ scale: 0.9, y: 50 }}
                        animate={{ scale: 1, y: 0 }}
                        onClick={(e) => e.stopPropagation()}
                        className="glass-strong rounded-3xl p-6 sm:p-8 max-w-4xl w-full my-8"
                    >
                        <div className="flex justify-between items-center mb-8">
                            <h2 className="text-2xl sm:text-3xl font-bold orbitron">Статистика</h2>
                            <button
                                onClick={(e) => {
                                    e.stopPropagation();
                                    onClose();
                                    playSound('click');
                                }}
                                className="glass px-4 py-2 rounded-xl hover:bg-white/10 transition-all"
                            >
                                Закрыть
                            </button>
                        </div>

                        {/* Rest of statistics component... */}
                        <div className="grid grid-cols-2 sm:grid-cols-4 gap-4 mb-8">
                            <div className="glass rounded-2xl p-4 sm:p-6 text-center">
                                <div className="text-3xl sm:text-4xl font-black text-emerald-400 mb-2">{completedLessons}</div>
                                <div className="text-xs sm:text-sm text-gray-400">Уроков пройдено</div>
                            </div>
                            <div className="glass rounded-2xl p-4 sm:p-6 text-center">
                                <div className="text-3xl sm:text-4xl font-black text-blue-400 mb-2">{user.streak}</div>
                                <div className="text-xs sm:text-sm text-gray-400">Дней подряд</div>
                            </div>
                            <div className="glass rounded-2xl p-4 sm:p-6 text-center">
                                <div className="text-3xl sm:text-4xl font-black text-yellow-400 mb-2">{totalXP}</div>
                                <div className="text-xs sm:text-sm text-gray-400">Всего XP</div>
                            </div>
                            <div className="glass rounded-2xl p-4 sm:p-6 text-center">
                                <div className="text-3xl sm:text-4xl font-black text-purple-400 mb-2">{currentLevel}</div>
                                <div className="text-xs sm:text-sm text-gray-400">Уровень</div>
                            </div>
                        </div>

                        <div className="glass rounded-2xl p-6 mb-6">
                            <h3 className="text-xl font-bold mb-4">Общий прогресс</h3>
                            <div className="w-full h-6 bg-gray-700 rounded-full overflow-hidden mb-2">
                                <div 
                                    className="h-full bg-gradient-to-r from-emerald-500 to-teal-500 transition-all duration-1000"
                                    style={{ width: `${progress}%` }}
                                />
                            </div>
                            <div className="text-right text-gray-400 text-sm">{Math.round(progress)}% завершено</div>
                        </div>

                        <div className="glass rounded-2xl p-6">
                            <h3 className="text-xl font-bold mb-4">Прогресс по разделам</h3>
                            <div className="space-y-3 max-h-64 overflow-y-auto">
                                {Object.entries(unitProgress).map(([unitName, data], index) => {
                                    const unitPercent = (data.completed / data.total) * 100;
                                    return (
                                        <div key={index} className="flex items-center space-x-3">
                                            <span className="text-2xl">{data.icon}</span>
                                            <div className="flex-1">
                                                <div className="flex justify-between text-sm mb-1">
                                                    <span className="line-clamp-1">{unitName}</span>
                                                    <span className="text-gray-400 ml-2 flex-shrink-0">{data.completed}/{data.total}</span>
                                                </div>
                                                <div className="w-full h-2 bg-gray-700 rounded-full overflow-hidden">
                                                    <div 
                                                        className="h-full bg-gradient-to-r from-emerald-500 to-teal-500 transition-all duration-500"
                                                        style={{ width: `${unitPercent}%` }}
                                                    />
                                                </div>
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                        </div>
                    </motion.div>
                </motion.div>
            );
        };

        // Render
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
